<header class="header">
  <div class="header-container">
    <!-- Mobile Menu Button -->
    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <span class="brand-title">Gilú</span>
      <span class="brand-tagline">Beauty Shop</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav-desktop" *ngIf="!isMobile">
      <a *ngFor="let link of navLinks" 
         [routerLink]="link.path" 
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: link.path === '/'}">
        {{ link.label }}
      </a>
    </nav>

    <!-- Search & Cart -->
    <div class="header-actions">
      <div class="search-box" *ngIf="!isMobile">
        <input 
          type="text" 
          placeholder="Buscar productos..."
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()">
        <button class="search-btn" (click)="onSearch()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <button class="cart-btn" (click)="toggleCart()">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" *ngIf="(cartItemCount$ | async) as count">{{ count }}</span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu-overlay" *ngIf="isMobile && isMenuOpen" (click)="closeMenu()"></div>
  
  <!-- Mobile Menu -->
  <nav class="nav-mobile" *ngIf="isMobile" [class.open]="isMenuOpen">
    <a *ngFor="let link of navLinks" 
       [routerLink]="link.path" 
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: link.path === '/'}"
       (click)="closeMenu()">
      {{ link.label }}
    </a>
    
    <div class="mobile-search">
      <input 
        type="text" 
        placeholder="Buscar productos..."
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch(); closeMenu()">
      <button (click)="onSearch(); closeMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>
  </nav>
</header>

<!-- Cart Sidebar -->
<app-cart-sidebar [isOpen]="isCartOpen" (close)="onCartClose()"></app-cart-sidebar>
