<div class="cart-overlay" *ngIf="isOpen" (click)="onClose()"></div>

<aside class="cart-sidebar" [@slideAnimation]="isOpen ? 'open' : 'closed'">
  <div class="cart-header">
    <h3>Tu Carrito</h3>
    <button class="close-btn" (click)="onClose()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="cart-content" *ngIf="cartItems$ | async as items">
    <div class="empty-cart" *ngIf="items.length === 0">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <p>Tu carrito está vacío</p>
      <span>¡Explora nuestros productos!</span>
    </div>

    <div class="cart-items" *ngIf="items.length > 0">
      <div class="cart-item" *ngFor="let item of items">
        <div class="item-image">
          <div class="placeholder-image"></div>
        </div>
        <div class="item-details">
          <h4>{{ item.product.name }}</h4>
          <span class="item-brand">{{ item.product.brand }}</span>
          <div class="item-bottom">
            <span class="item-price">${{ item.product.price.toFixed(2) }}</span>
            <div class="quantity-controls">
              <button (click)="updateQuantity(item.product.id, item.quantity - 1)">-</button>
              <span>{{ item.quantity }}</span>
              <button (click)="updateQuantity(item.product.id, item.quantity + 1)">+</button>
            </div>
          </div>
        </div>
        <button class="remove-btn" (click)="removeItem(item.product.id)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="cart-footer" *ngIf="cartItems$ | async as items">
    <div class="cart-total" *ngIf="items.length > 0">
      <span>Total</span>
      <span class="total-amount">${{ total.toFixed(2) }}</span>
    </div>

    <div class="cart-actions" *ngIf="items.length > 0">
      <button class="btn-checkout" (click)="checkout()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        Confirmar pedido por WhatsApp 💬
      </button>
      <button class="btn-clear" (click)="clearCart()">Vaciar carrito</button>
    </div>
  </div>
</aside>
