<section class="influencer-section">
  <div class="container">
    <div class="influencer-heading">
      <h2 class="influencer-heading__title">Videos de maquillaje</h2>
      <p class="influencer-heading__lead">Recomendaciones de productos y marcas disponibles en Gilú Shop.</p>
    </div>

    <div class="videos-grid">
      <article class="video-card" *ngFor="let video of videos; let i = index">
        <div class="video-wrapper">
          <button
            class="video-thumbnail"
            *ngIf="playingVideo !== i"
            type="button"
            (click)="playVideo(i)"
            [attr.aria-label]="'Reproducir video: ' + video.title">
            <img [src]="video.thumbnailUrl" alt="" loading="lazy">
            <span class="play-button" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
            </span>
          </button>

          <iframe *ngIf="playingVideo === i"
                  [src]="video.embedUrl"
                  [title]="video.title"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowfullscreen>
          </iframe>

          <button
            class="close-video"
            *ngIf="playingVideo === i"
            type="button"
            [attr.aria-label]="'Cerrar video: ' + video.title"
            (click)="stopVideo()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="video-info">
          <div class="info-text">
            <h4>{{ video.title }}</h4>
            <p class="influencer-name">{{ video.influencer }}</p>
            <span class="product-tag">{{ video.product }}</span>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
