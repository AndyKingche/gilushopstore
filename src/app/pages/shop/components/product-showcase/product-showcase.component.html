<div class="product-showcase">
  <button class="nav-arrow prev" (click)="prev()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="showcase-card">
    <div class="card-image" [style.background-image]="'url(' + currentCategory.imageUrl + ')'">
      <!-- <span class="category-name">{{ currentCategory.name }}</span> -->
    </div>
    <div class="card-info">
      <h3>{{ currentCategory.name }}</h3>
      <p>{{ currentCategory.description }}</p>
      <div class="brands">
        <span class="brand-badge" *ngFor="let brand of currentCategory.brands">{{ brand }}</span>
      </div>
      <button class="btn-view" (click)="viewProducts(currentCategory.id)">
        Ver productos →
      </button>
    </div>
  </div>

  <button class="nav-arrow next" (click)="next()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
</div>
