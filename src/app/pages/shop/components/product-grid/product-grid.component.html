<div class="products-section" id="products-section">
  <div class="empty-state" *ngIf="!products || products.length === 0">
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <h3>No se encontraron productos</h3>
    <p>Intenta con otros términos de búsqueda</p>
  </div>

  <div class="product-grid" *ngIf="products && products.length > 0">
    <div class="product-card" *ngFor="let product of products; let i = index; trackBy: trackByProduct" appScrollAnimation [style.animationDelay]="getAnimationDelay(i)">
      <div class="card-image">
        <span class="brand-badge">{{ product.brand }}</span>
        <span *ngIf="!product.inStock" class="out-badge">Agotado</span>
      </div>
      <div class="card-body">
        <p class="card-category">{{ product.category }}</p>
        <h4 class="card-name">{{ product.name }}</h4>
        <p class="card-desc">{{ product.description }}</p>
        <div class="card-footer">
          <span class="card-price">${{ product.price.toFixed(2) }}</span>
          <button class="btn-cart" (click)="addToCart(product)" [disabled]="!product.inStock">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            Agregar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
