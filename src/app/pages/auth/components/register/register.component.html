<div class="auth-page">
  <!-- Sparkle decorations -->
  <div class="sparkle sparkle-1">✨</div>
  <div class="sparkle sparkle-2">💫</div>
  <div class="sparkle sparkle-3">⭐</div>
  <div class="sparkle sparkle-4">💖</div>
  <div class="sparkle sparkle-5">✨</div>

  <div class="auth-container">
    <div class="auth-card">
      <!-- Header with gradient -->
      <div class="card-header">
        <div class="header-shine"></div>
        <span class="header-icon">
        <svg width="80" height="80" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <style>
            .ts { font-family: monospace; font-size: 8px; fill: #D95F80; opacity: 0.7; }
          </style>

          <g transform="translate(100,100)">

            <!-- outer ring dashed tech -->
            <circle cx="0" cy="0" r="95" fill="none" stroke="#F2BBC9" stroke-width="1.2" stroke-dasharray="6 4"/>

            <!-- tick marks -->
            <g opacity="0.5">
              <line x1="0" y1="-95" x2="0" y2="-88" stroke="#D95F80" stroke-width="2" stroke-linecap="round"/>
              <line x1="0" y1="-95" x2="0" y2="-88" stroke="#D95F80" stroke-width="2" stroke-linecap="round" transform="rotate(45)"/>
              <line x1="0" y1="-95" x2="0" y2="-88" stroke="#D95F80" stroke-width="2" stroke-linecap="round" transform="rotate(90)"/>
              <line x1="0" y1="-95" x2="0" y2="-88" stroke="#D95F80" stroke-width="2" stroke-linecap="round" transform="rotate(135)"/>
              <line x1="0" y1="-95" x2="0" y2="-88" stroke="#D95F80" stroke-width="2" stroke-linecap="round" transform="rotate(180)"/>
              <line x1="0" y1="-95" x2="0" y2="-88" stroke="#D95F80" stroke-width="2" stroke-linecap="round" transform="rotate(225)"/>
              <line x1="0" y1="-95" x2="0" y2="-88" stroke="#D95F80" stroke-width="2" stroke-linecap="round" transform="rotate(270)"/>
              <line x1="0" y1="-95" x2="0" y2="-88" stroke="#D95F80" stroke-width="2" stroke-linecap="round" transform="rotate(315)"/>
            </g>

            <!-- corner brackets -->
            <path d="M-58 -72 L-72 -72 L-72 -58" fill="none" stroke="#D98BA7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M58 -72 L72 -72 L72 -58"    fill="none" stroke="#D98BA7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M-58 72 L-72 72 L-72 58"    fill="none" stroke="#D98BA7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M58 72 L72 72 L72 58"       fill="none" stroke="#D98BA7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- side scan lines -->
            <line x1="-76" y1="0" x2="-60" y2="0" stroke="#B8D5D9" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="60"  y1="0" x2="76"  y2="0" stroke="#B8D5D9" stroke-width="1.2" stroke-linecap="round"/>

            <!-- main circle -->
            <circle cx="0" cy="0" r="76" fill="#F2BBC9"/>
            <!-- inner circle -->
            <circle cx="0" cy="0" r="62" fill="#D95F80"/>

            <!-- subtle inner rings -->
            <circle cx="0" cy="0" r="62" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.15"/>
            <circle cx="0" cy="0" r="42" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.10"/>

            <!-- user head -->
            <circle cx="0" cy="-18" r="19" fill="#FFFFFF"/>
            <!-- user body -->
            <path d="M-27 24 Q-27 2 0 2 Q27 2 27 24 Z" fill="#FFFFFF"/>

            <!-- plus badge -->
            <circle cx="48" cy="48" r="22" fill="#F2BBC9" stroke="#D98BA7" stroke-width="1.5" stroke-dasharray="3 3"/>
            <circle cx="48" cy="48" r="16" fill="#0D0D0D"/>
            <rect x="41" y="46" width="14" height="4" rx="2" fill="#F2BBC9"/>
            <rect x="46" y="41" width="4" height="14" rx="2" fill="#F2BBC9"/>

            <!-- orbital dots -->
            <circle cx="0"   cy="-76" r="3.5" fill="#B8D5D9"/>
            <circle cx="76"  cy="0"   r="2.5" fill="#D98BA7"/>
            <circle cx="-76" cy="0"   r="2.5" fill="#D98BA7"/>
            <circle cx="0"   cy="76"  r="3.5" fill="#B8D5D9"/>

            <!-- mono labels -->
            <text x="-82" y="-50" class="ts" text-anchor="end">USR</text>
            <text x="-82" y="-40" class="ts" text-anchor="end">NEW</text>
            <text x="82"  y="-50" class="ts" text-anchor="start">01</text>
            <text x="82"  y="-40" class="ts" text-anchor="start">FN</text>
          </g>
        </svg>
      </span>
        <h2>Crear Cuenta</h2>
        <p>Únete a la familia Gilú Shop</p>
      </div>

      <form class="auth-form" (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <!-- Username -->
        <div class="form-group">
          <label for="userName">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            Email
          </label>
          <input 
            type="email" 
            id="userName" 
            name="userName" 
            [(ngModel)]="user.userName" 
            required
            email
            placeholder="Tu email de usuario"
            class="form-input"
            #emailInput="ngModel"
          >
          <span class="validation-error" *ngIf="emailInput.invalid && emailInput.touched">
            Por favor ingresa un correo válido
          </span>
        </div>

        <!-- Name fields row -->
        <div class="form-row">
          <!-- Firstname -->
          <div class="form-group">
            <label for="userFirstname">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              Nombre
            </label>
            <input 
              type="text" 
              id="userFirstname" 
              name="userFirstname" 
              [(ngModel)]="user.userFirstname" 
              required
              placeholder="Tu nombre"
              class="form-input"
            >
          </div>

          <!-- Lastname -->
          <div class="form-group">
            <label for="userLastname">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              Apellido
            </label>
            <input 
              type="text" 
              id="userLastname" 
              name="userLastname" 
              [(ngModel)]="user.userLastname" 
              required
              placeholder="Tu apellido"
              class="form-input"
            >
          </div>
        </div>

        <!-- Gender -->
        <div class="form-group">
          <label for="userGender">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
              <path d="M12 6v12M6 12h12"></path>
            </svg>
            Género
          </label>
          <select 
            id="userGender" 
            name="userGender" 
            [(ngModel)]="user.userGender" 
            required
            class="form-input form-select"
          >
            <option value="" disabled selected>Selecciona tu género</option>
            <option value="F">Femenino</option>
            <option value="M">Masculino</option>
            <option value="O">Otro</option>
          </select>
        </div>

        <!-- Identification -->
        <div class="form-group">
          <label for="userIdentification">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M7 8h10M7 12h6"></path>
            </svg>
            Cédula de identidad
          </label>
          <input 
            type="text" 
            id="userIdentification" 
            name="userIdentification" 
            [(ngModel)]="user.userIdentification" 
            required
            placeholder="Tu número de identificación"
            class="form-input"
          >
        </div>

        <!-- RUC (optional for businesses) -->
        <div class="form-group">
          <label for="userRuc">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M7 8h10M7 12h6"></path>
            </svg>
            RUC (Opcional)
          </label>
          <input 
            type="text" 
            id="userRuc" 
            name="userRuc" 
            [(ngModel)]="user.userRuc" 
            placeholder="Tu RUC si eres empresa"
            class="form-input"
          >
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="userPassword">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Contraseña
          </label>
          <div class="password-input-wrapper">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="userPassword" 
              name="userPassword" 
              [(ngModel)]="user.userPassword" 
              required
              placeholder="Crea una contraseña segura"
              class="form-input"
            >
            <button 
              type="button" 
              class="toggle-password"
              (click)="showPassword = !showPassword"
            >
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Confirmar contraseña
          </label>
          <div class="password-input-wrapper">
            <input 
              [type]="showConfirmPassword ? 'text' : 'password'" 
              id="confirmPassword" 
              name="confirmPassword" 
              [(ngModel)]="confirmPassword" 
              required
              placeholder="Confirma tu contraseña"
              class="form-input"
            >
            <button 
              type="button" 
              class="toggle-password"
              (click)="showConfirmPassword = !showConfirmPassword"
            >
              <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error message -->
        <div class="error-message" *ngIf="errorMessage">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ errorMessage }}
        </div>

        <!-- Submit button -->
        <button 
          type="submit" 
          class="btn-submit"
          [disabled]="isLoading || !registerForm.form.valid"
        >
          <span *ngIf="!isLoading">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            Crear mi cuenta
          </span>
          <span *ngIf="isLoading" class="loading-spinner">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>

        <!-- Login link -->
        <div class="auth-footer">
          <p>¿Ya tienes cuenta? <a (click)="goToLogin()">Inicia sesión</a></p>
        </div>
      </form>
    </div>

    <!-- Back button -->
    <button class="btn-back" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Volver
    </button>
  </div>
</div>
