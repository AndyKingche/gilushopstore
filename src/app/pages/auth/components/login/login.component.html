<div class="auth-page">
  <!-- Sparkle decorations -->
  <div class="sparkle sparkle-1">✨</div>
  <div class="sparkle sparkle-2">💫</div>
  <div class="sparkle sparkle-3">⭐</div>
  <div class="sparkle sparkle-4">💖</div>
  <div class="sparkle sparkle-5">✨</div>

  <div class="auth-container">
    <div class="auth-card">
      <!-- Header with gradient -->
      <div class="card-header">
        <div class="header-shine"></div>
        <span class="header-icon">💋</span>
        <h2>Bienvenida</h2>
        <p>Inicia sesión en Gilú Shop</p>
      </div>

      <form class="auth-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <!-- Username -->
        <div class="form-group">
          <label for="userName">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Nombre de usuario
          </label>
          <input 
            type="text" 
            id="userName" 
            name="userName" 
            [(ngModel)]="credentials.userName" 
            required
            placeholder="Tu nombre de usuario"
            class="form-input"
          >
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="userPassword">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Contraseña
          </label>
          <div class="password-input-wrapper">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="userPassword" 
              name="userPassword" 
              [(ngModel)]="credentials.userPassword" 
              required
              placeholder="Tu contraseña"
              class="form-input"
            >
            <button 
              type="button" 
              class="toggle-password"
              (click)="showPassword = !showPassword"
            >
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember me & Forgot password -->
        <div class="form-options">
          <label class="checkbox-wrapper">
            <input 
              type="checkbox" 
              name="rememberMe" 
              [(ngModel)]="rememberMe"
            >
            <span class="checkbox-custom"></span>
            <span class="checkbox-label">Recordarme</span>
          </label>
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Error message -->
        <div class="error-message" *ngIf="errorMessage">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ errorMessage }}
        </div>

        <!-- Submit button -->
        <button 
          type="submit" 
          class="btn-submit"
          [disabled]="isLoading || !loginForm.form.valid"
        >
          <span *ngIf="!isLoading">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            Iniciar sesión
          </span>
          <span *ngIf="isLoading" class="loading-spinner">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>

        <!-- Register link -->
        <div class="auth-footer">
          <p>¿No tienes cuenta? <a (click)="goToRegister()">Crear cuenta</a></p>
        </div>
      </form>
    </div>

    <!-- Back button -->
    <button class="btn-back" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Volver
    </button>
  </div>
</div>
