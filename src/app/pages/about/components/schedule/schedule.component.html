<div class="schedule-container">
  <!-- Status indicator -->
  <div class="store-status" [ngClass]="getStatusClass()">
    <span class="status-dot"></span>
    <span class="status-text">{{ getStatusText() }}</span>
    <span class="current-time">{{ currentTime }}</span>
  </div>
  
  <div class="schedule-row" 
       *ngFor="let s of schedule"
       [class.today]="s.dayNum === today">
    <div class="day-name">
      {{ s.day }}
      <span class="today-badge" *ngIf="s.dayNum === today">Hoy 📍</span>
    </div>
    <div class="hours">{{ s.open }} — {{ s.close }}</div>
  </div>
</div>
